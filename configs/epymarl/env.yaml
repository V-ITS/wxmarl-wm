# Env-level EPyMARL config for WxMARL (plays the role of EPyMARL's config/envs/<env>.yaml).
env: "wxmarl"

env_args:
  map_name: "default" # weather preset: configs/env/<map_name>.yaml
  render: False # rendering is off in training
  eval_scenarios: False # True: episode k uses eval_seeds[k] from the env config
  out_dir: null # where replays, videos and metrics.json go (default: results/renders/...)
  checkpoint: null # recorded in replay metadata by scripts/evaluate.py

# Same schedule as EPyMARL's gymma env config, except test_nepisode (100 -> 20).
test_greedy: True
test_nepisode: 20
test_interval: 50000
log_interval: 50000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 2050000

save_model: True
save_model_interval: 100000

use_wandb: False # scripts/train.sh turns this on
wandb_team: null
wandb_project: "wxmarl"
wandb_mode: "online"
